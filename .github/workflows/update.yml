name: Update prop board

on:
  schedule:
    # Times are UTC. During daylight time (until Nov 1) these are:
    - cron: "0 20 * * 4"   # Thu 1:00 PM PT  - before Thursday Night Football
    - cron: "0 16 * * 5"   # Fri 9:00 AM PT  - Sunday + Monday games
    - cron: "0 16 * * 6"   # Sat 9:00 AM PT  - Sunday + Monday games
  workflow_dispatch:
    inputs:
      week:
        description: "Week to score (leave blank for the current week)"
        required: false

permissions:
  contents: write

concurrency:
  group: prop-board
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check the model still matches the published Week 4 board
        run: python tests/test_engine.py
      - name: Pull Kalshi, Sleeper and PFR data
        env:
          WEEK: ${{ github.event.inputs.week }}
        run: python fetch.py
      - name: Score props
        run: python engine.py
      - name: Build page
        run: python build.py
      - name: Publish
        run: |
          git config user.name "prop-board-bot"
          git config user.email "prop-board-bot@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update prop board $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
