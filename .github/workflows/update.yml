name: Update prop board

on:
  schedule:
    # Times are UTC. Every 20 minutes, around the clock: a quick refresh of prices, injuries, lines and scores.
    - cron: "0,20,40 * * * *"
    # Full runs (also ask Kalshi for real parlay quotes), set off the 20-minute marks so they don't collide.
    # During daylight time (until Nov 1) these are:
    - cron: "5 20 * * 4"   # Thu 1:05 PM PT  - before Thursday Night Football
    - cron: "5 16 * * 5"   # Fri 9:05 AM PT
    - cron: "5 16 * * 6"   # Sat 9:05 AM PT
    - cron: "50 15 * * 0"  # Sun 8:50 AM PT  - after injury news, before the 10 AM PT kickoffs
  workflow_dispatch:
    inputs:
      week:
        description: "Week to score (leave blank for the current week)"
        required: false

permissions:
  contents: write

concurrency:
  group: prop-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the model still matches the published Week 4 board
        run: python tests/test_engine.py

      - name: Pull Kalshi, Sleeper and PFR data
        env:
          WEEK: ${{ github.event.inputs.week }}
        run: python fetch.py

      - name: Get game context (lines, weather, injuries, news, buzz)
        continue-on-error: true
        run: python context.py

      - name: Score props
        run: python engine.py

      - name: Get Kalshi parlay quotes
        continue-on-error: true
        env:
          # the 20-minute refreshes reuse the last full run's parlay quotes instead of asking Kalshi again
          QUOTES: ${{ github.event.schedule == '0,20,40 * * * *' && '0' || '1' }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python parlay.py

      - name: Build page
        run: python build.py

      - name: Publish
        run: |
          git config user.name "prop-board-bot"
          git config user.email "prop-board-bot@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update prop board $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
